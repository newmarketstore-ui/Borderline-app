# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c3c85ae5dff56888ac2834cb8b31f7d6"
name = "BorderlineAI"
application_url = "https://borderline-app-lntir.ondigitalocean.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_analytics,read_customers,read_inventory,read_locations,read_orders,read_product_feeds,read_product_listings,read_products,read_reports,read_store_credit_accounts,write_customers,write_discounts,write_orders,write_store_credit_account_transactions"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # 会员积分（loyalty）：全部先落库 WebhookEvent 再交给 pg-boss 异步处理
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/update"
  topics = [ "customers/update" ]

  # GDPR 必备（compliance topics）
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

# 店面 App Proxy：主题 / 顾客端 JS 调 https://<店>/apps/loyalty/* → 我们的 /proxy/loyalty/*（Shopify 签名 + logged_in_customer_id）
[app_proxy]
url = "https://borderline-app-lntir.ondigitalocean.app/proxy/loyalty"
subpath = "loyalty"
prefix = "apps"

[auth]
redirect_urls = [
  "https://borderline-app-lntir.ondigitalocean.app/auth/callback",
  "https://borderline-app-lntir.ondigitalocean.app/auth/shopify/callback",
  "https://borderline-app-lntir.ondigitalocean.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
