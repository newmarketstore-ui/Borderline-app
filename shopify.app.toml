# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c3c85ae5dff56888ac2834cb8b31f7d6"
name = "BorderlineAI"
application_url = "https://borderline-ai.fly.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_analytics,read_inventory,read_locations,read_orders,read_product_feeds,read_product_listings,read_products,read_reports"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [
  "https://borderline-ai.fly.dev/auth/callback",
  "https://borderline-ai.fly.dev/auth/shopify/callback",
  "https://borderline-ai.fly.dev/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
