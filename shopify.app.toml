# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c3c85ae5dff56888ac2834cb8b31f7d6"
name = "BorderlineAI"
application_url = "https://borderline-app-lntir.ondigitalocean.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# 2026-10-29 事故教训：后端脚本 / 主题推送与积分功能共用这个应用，deploy 会整份替换 scopes。
# 这里必须 = 上一版全部权限（borderlineai-9，77 个）+ 积分新增 5 个；改动前先对照 Dev Dashboard → Versions。
scopes = "read_all_orders,read_analytics,read_analytics_annotations,write_analytics_annotations,read_app_proxy,read_apps,read_assigned_fulfillment_orders,read_audit_events,read_customer_events,read_cart_transforms,read_all_cart_transforms,read_validations,read_cash_tracking,read_channels,write_channels,read_checkout_and_accounts_configurations,read_checkout_branding_settings,read_checkouts,read_companies,read_custom_fulfillment_services,read_custom_pixels,read_customers,read_customer_data_erasure,read_customer_payment_methods,read_customer_merge,read_price_rules,read_discovery,read_draft_orders,read_files,read_fulfillment_constraint_rules,read_fulfillments,read_gift_card_transactions,read_gift_cards,write_inventory,read_inventory,write_inventory_shipments_received_items,read_inventory_shipments_received_items,read_inventory_transfers,read_legal_policies,read_delivery_option_generators,read_locales,write_locations,write_marketing_events,read_markets,read_markets_home,read_merchant_managed_fulfillment_orders,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_online_store_navigation,read_online_store_pages,read_orders,read_product_feeds,write_product_feeds,read_product_listings,write_product_listings,read_products,write_products,read_publications,write_publications,read_reports,read_returns,read_shipping,write_shipping,read_content,write_content,read_store_credit_accounts,write_theme_code,read_themes,write_themes,read_pixels,write_pixels,customer_read_draft_orders,customer_read_markets,customer_read_metaobjects,shop_app:oauth,read_locations,write_customers,write_discounts,write_orders,write_store_credit_account_transactions"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # 会员积分（loyalty）：全部先落库 WebhookEvent 再交给 pg-boss 异步处理
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/update"
  topics = [ "customers/update" ]

  # GDPR 必备（compliance topics）
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

# 店面 App Proxy：主题 / 顾客端 JS 调 https://<店>/apps/bl-points/* → 我们的 /proxy/loyalty/*（/apps/loyalty 被 Appstle 占用，10/29 实测 401）（Shopify 签名 + logged_in_customer_id）
[app_proxy]
url = "https://borderline-app-lntir.ondigitalocean.app/proxy/loyalty"
subpath = "bl-points"
prefix = "apps"

[auth]
redirect_urls = [
  "https://borderline-app-lntir.ondigitalocean.app/auth/callback",
  "https://borderline-app-lntir.ondigitalocean.app/auth/shopify/callback",
  "https://borderline-app-lntir.ondigitalocean.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
