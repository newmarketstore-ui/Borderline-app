# DigitalOcean App Platform 规格（老板 10/28 定平台）。
# 用法：doctl apps create --spec .do/app.yaml ；更新：doctl apps update <id> --spec .do/app.yaml
# 占位：<GITHUB_REPO> 换成老板建好的仓库名（newmarketstore-ui/<name>）。
# 环境变量的值不写在这里：SECRET 类型在 DO 控制台或 doctl 里单独设置，永不入库。
name: borderline-app
region: tor
services:
  - name: web
    github:
      repo: newmarketstore-ui/Borderline-app
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb   # $25/月；队列 pg-boss 跑在同一进程里，量大再拆 worker
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SHOPIFY_API_KEY
        value: c3c85ae5dff56888ac2834cb8b31f7d6   # 公开的 client_id，不是密钥
      - key: SHOPIFY_APP_URL
        value: ${APP_URL}                          # 首次部署后换成自定义域名
      - key: SCOPES
        value: read_all_orders,read_analytics,read_analytics_annotations,write_analytics_annotations,read_app_proxy,read_apps,read_assigned_fulfillment_orders,read_audit_events,read_customer_events,read_cart_transforms,read_all_cart_transforms,read_validations,read_cash_tracking,read_channels,write_channels,read_checkout_and_accounts_configurations,read_checkout_branding_settings,read_checkouts,read_companies,read_custom_fulfillment_services,read_custom_pixels,read_customers,read_customer_data_erasure,read_customer_payment_methods,read_customer_merge,read_price_rules,read_discovery,read_draft_orders,read_files,read_fulfillment_constraint_rules,read_fulfillments,read_gift_card_transactions,read_gift_cards,write_inventory,read_inventory,write_inventory_shipments_received_items,read_inventory_shipments_received_items,read_inventory_transfers,read_legal_policies,read_delivery_option_generators,read_locales,write_locations,write_marketing_events,read_markets,read_markets_home,read_merchant_managed_fulfillment_orders,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_online_store_navigation,read_online_store_pages,read_orders,read_product_feeds,write_product_feeds,read_product_listings,write_product_listings,read_products,write_products,read_publications,write_publications,read_reports,read_returns,read_shipping,write_shipping,read_content,write_content,read_store_credit_accounts,write_theme_code,read_themes,write_themes,read_pixels,write_pixels,customer_read_draft_orders,customer_read_markets,customer_read_metaobjects,shop_app:oauth,read_locations,write_customers,write_discounts,write_orders,write_store_credit_account_transactions
      - key: SHOPIFY_API_SECRET
        type: SECRET
        value: ""                                  # 部署时在 DO 里填
      - key: DATABASE_URL
        type: SECRET
        value: ""                                  # Supabase 会话池 5432
      - key: MANUAL_METRICS_EXPORT_TOKEN
        type: SECRET
        value: ""
      - key: PGBOSS_SSL
        value: require
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
